
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Godot and export templates
        shell: bash
        run: |
          set -e
          VERSION="4.4.1"
          BASE="https://github.com/godotengine/godot/releases/download/${VERSION}-stable"

          wget -q "${BASE}/Godot_v${VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${VERSION}-stable_linux.x86_64"
          sudo install -m 755 "Godot_v${VERSION}-stable_linux.x86_64" /usr/local/bin/godot

          wget -q "${BASE}/Godot_v${VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${VERSION}-stable_export_templates.tpz"

          mkdir -p "$HOME/.local/share/godot/export_templates/${VERSION}.stable"
          cp -r templates/. "$HOME/.local/share/godot/export_templates/${VERSION}.stable/"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Create debug keystore
        shell: bash
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/debug.keystore" \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Configure Godot Android SDK
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Create Android export preset
        shell: bash
        run: |
          cat > export_presets.cfg <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/RiseOfConquest.apk"

          [preset.0.options]

          gradle_build/use_gradle_build=false
          package/unique_name="com.riseofconquest.game"
          package/name="Rise of Conquest"
          package/signed=true
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          launcher_icons/main_192x192="res://file_00000000c90882439a56ebc361859e8f.png"
          EOF

      - name: Import Godot project
        shell: bash
        run: |
          godot --headless --path . --editor --import

      - name: Export Android APK
        shell: bash
        run: |
          mkdir -p build
          godot --headless --path . \
            --export-debug "Android" \
            build/RiseOfConquest.apk

      - name: Verify APK
        shell: bash
        run: |
          test -s build/RiseOfConquest.apk
          ls -lh build/RiseOfConquest.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: RiseOfConquest-Android
          path: build/RiseOfConquest.apk
          if-no-files-found: error
          retention-days: 30
