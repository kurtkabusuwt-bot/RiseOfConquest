
name: Build and Publish Rise of Conquest APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: rise-of-conquest-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Godot and export templates
        shell: bash
        run: |
          set -e
          VERSION="4.4.1"
          BASE="https://github.com/godotengine/godot/releases/download/${VERSION}-stable"

          wget -q "${BASE}/Godot_v${VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${VERSION}-stable_linux.x86_64"
          sudo install -m 755 "Godot_v${VERSION}-stable_linux.x86_64" /usr/local/bin/godot

          wget -q "${BASE}/Godot_v${VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${VERSION}-stable_export_templates.tpz"

          mkdir -p "$HOME/.local/share/godot/export_templates/${VERSION}.stable"
          cp -r templates/. "$HOME/.local/share/godot/export_templates/${VERSION}.stable/"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Create debug keystore
        shell: bash
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/debug.keystore" \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Configure Godot Android SDK
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Apply mobile gameplay improvements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("main.gd")
          code = path.read_text(encoding="utf-8")

          def change(old, new):
              global code
              if old not in code:
                  raise RuntimeError("Expected code not found: " + old[:60])
              code = code.replace(old, new, 1)

          change(
              "var camera_distance := 31.0",
              "var camera_distance := 25.0"
          )

          change(
              'title.text = "  RISE OF CONQUEST  |  PROTOTIP 1.2"',
              'title.text = "  RISE OF CONQUEST  |  1.3"'
          )

          change("top.offset_bottom = 55", "top.offset_bottom = 48")
          change("bottom.offset_top = -140", "bottom.offset_top = -118")

          change(
              "scroll.custom_minimum_size = Vector2(0, 64)",
              "scroll.custom_minimum_size = Vector2(0, 66)"
          )

          change(
              "button.custom_minimum_size = Vector2(135, 58)",
              "button.custom_minimum_size = Vector2(132, 60)"
          )

          change(
              "camera_distance = 31.0\n\t\tcamera_pitch = -0.85",
              "camera_distance = 25.0\n\t\tcamera_pitch = -0.85"
          )

          change(
              "camera_yaw -= event.relative.x * 0.006\n\t\t\t\tcamera_pitch = clampf(camera_pitch - event.relative.y * 0.003, -1.25, -0.35)\n\t\t\t\tupdate_camera()",
              "pan_mobile_camera(event.relative)"
          )

          change(
              "camera_yaw -= event.relative.x * 0.006\n\t\t\tupdate_camera()",
              "pan_mobile_camera(event.relative)"
          )

          helper = '''
          func pan_mobile_camera(movement: Vector2) -> void:
              var right := Vector3(cos(camera_yaw), 0.0, -sin(camera_yaw))
              var forward := Vector3(sin(camera_yaw), 0.0, cos(camera_yaw))
              var speed := camera_distance * 0.0017
              camera_pivot.position -= right * movement.x * speed
              camera_pivot.position -= forward * movement.y * speed
              if world_mode:
                  camera_pivot.position.x = clampf(camera_pivot.position.x, WORLD_OFFSET - 75.0, WORLD_OFFSET + 75.0)
                  camera_pivot.position.z = clampf(camera_pivot.position.z, -75.0, 75.0)
              else:
                  camera_pivot.position.x = clampf(camera_pivot.position.x, -15.0, 15.0)
                  camera_pivot.position.z = clampf(camera_pivot.position.z, -15.0, 15.0)
              update_camera()

          '''
          helper = helper.replace("    ", "\t")

          change(
              "func handle_ground_tap(screen_pos: Vector2) -> void:",
              helper + "func handle_ground_tap(screen_pos: Vector2) -> void:"
          )

          change(
              "pinch_last_distance = 0.0\n\telif event is InputEventScreenDrag:",
              "pinch_last_distance = 0.0\n\t\t\tif not touch_positions.is_empty():\n\t\t\t\tdragging = true\n\telif event is InputEventScreenDrag:"
          )

          path.write_text(code, encoding="utf-8")
          print("Rise of Conquest 1.3 mobile improvements applied")
          PY

      - name: Create Android export preset
        shell: bash
        run: |
          cat > export_presets.cfg <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/RiseOfConquest.apk"

          [preset.0.options]

          gradle_build/use_gradle_build=false
          package/unique_name="com.riseofconquest.game"
          package/name="Rise of Conquest"
          package/signed=true
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          launcher_icons/main_192x192="res://file_00000000c90882439a56ebc361859e8f.png"
          EOF

      - name: Import Godot project
        shell: bash
        run: |
          godot --headless --path . --editor --import

      - name: Export Android APK
        shell: bash
        run: |
          mkdir -p build
          godot --headless --path . \
            --export-debug "Android" \
            build/RiseOfConquest.apk

      - name: Verify APK
        shell: bash
        run: |
          test -s build/RiseOfConquest.apk
          ls -lh build/RiseOfConquest.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: RiseOfConquest-Android
          path: build/RiseOfConquest.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          TAG="build-${GITHUB_RUN_NUMBER}"

          gh release create "$TAG" \
            build/RiseOfConquest.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Rise of Conquest 1.3 - Build ${GITHUB_RUN_NUMBER}" \
            --notes "Android APK - OnePlus Pad 3 test surumu. Mobil kamera ve arayuz gelistirmeleri."
